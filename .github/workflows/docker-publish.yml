# This workflow publishes a multi-arch Docker image (amd64 + arm64) to GHCR.
# Fork-friendly: no upstream repository guard, builds run on push to
# staging/release, on releases, and on a daily schedule for staging.

name: Create Docker Image (Release and Staging)

on:
  release:
    # Allow pre-releases
    types: [published]
  schedule:
    # Build the staging image every day at 00:00 UTC
    - cron: "0 0 * * *"
  push:
    # Build on every push to staging (fork drop-in image) and release
    branches:
      - staging
      - release

env:
  # Allows image creation in forked repositories under their own namespace
  REPO: ${{ github.repository }}
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the canonical tag name once and share it with the arch jobs.
  # This avoids the "git tag shadows branch name" problem we hit earlier.
  # ---------------------------------------------------------------------------
  resolve-meta:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      tag: ${{ steps.meta.outputs.tag }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      is_release_branch: ${{ steps.meta.outputs.is_release_branch }}
    steps:
      - name: Resolve image name and tag
        id: meta
        run: |
          # Lowercase the full repo slug for GHCR
          IMAGE_NAME="${REPO,,}"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

          # Determine the effective ref name.
          # - release event  -> tag name (e.g. 1.12.10)
          # - schedule       -> staging
          # - push           -> branch name (staging or release)
          case "${{ github.event_name }}" in
            release)
              TAG="${{ github.ref_name }}"
              ;;
            schedule)
              TAG="staging"
              ;;
            *)
              TAG="${{ github.ref_name }}"
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Short sha, prefixed with the tag for traceability
          SHA_TAG="${TAG}-${GITHUB_SHA::7}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

          # Track whether we're on the release branch so we can also tag :latest
          if [ "$TAG" = "release" ] || [ "${{ github.event_name }}" = "release" ]; then
            echo "is_release_branch=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_branch=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Per-arch builds on GitHub's native runners (no QEMU).
  # Each job builds a single-platform image and pushes it as an architecture-
  # specific tag. The merge job then assembles them into a multi-arch manifest.
  # ---------------------------------------------------------------------------
  build:
    needs: resolve-meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (release event)
        if: ${{ github.event_name == 'release' }}
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
        with:
          ref: "release"

      - name: Checkout (schedule -> staging)
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
        with:
          ref: "staging"

      - name: Checkout (push)
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Architecture-specific tag so the merge job can reference a single
      # platform image without ambiguity (e.g. ...:staging-amd64).
      - name: Build and push single-platform image
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0 # v5.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.resolve-meta.outputs.image_name }}:${{ needs.resolve-meta.outputs.sha_tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=SillyTavern
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Merge the two arch-specific images into a single multi-arch manifest,
  # tagged with the branch/release name (+ :latest on the release branch).
  # ---------------------------------------------------------------------------
  merge:
    needs: [resolve-meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS (for manifest operations)
        uses: oras-project/setup-oras@v1

      - name: Assemble multi-arch manifest and tag
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.resolve-meta.outputs.image_name }}
          TAG: ${{ needs.resolve-meta.outputs.tag }}
          SHA_TAG: ${{ needs.resolve-meta.outputs.sha_tag }}
        run: |
          set -euo pipefail

          # Build a multi-arch manifest from the per-arch images we just pushed.
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${SHA_TAG}-amd64" \
            "${IMAGE}:${SHA_TAG}-arm64"

          # Also tag with the commit-sha tag for an immutable reference.
          docker buildx imagetools create -t "${IMAGE}:${SHA_TAG}" \
            "${IMAGE}:${SHA_TAG}-amd64" \
            "${IMAGE}:${SHA_TAG}-arm64"

          # Tag :latest on release branch / release events.
          if [ "${{ needs.resolve-meta.outputs.is_release_branch }}" = "true" ]; then
            docker buildx imagetools create -t "${IMAGE}:latest" \
              "${IMAGE}:${SHA_TAG}-amd64" \
              "${IMAGE}:${SHA_TAG}-arm64"
          fi

      - name: Show resulting tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.resolve-meta.outputs.image_name }}
        run: |
          echo "Published tags:"
          echo "  ${IMAGE}:${{ needs.resolve-meta.outputs.tag }}"
          echo "  ${IMAGE}:${{ needs.resolve-meta.outputs.sha_tag }}"
          if [ "${{ needs.resolve-meta.outputs.is_release_branch }}" = "true" ]; then
            echo "  ${IMAGE}:latest"
          fi
